org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The android.defaults.buildfeatures.* properties that used to go here were
# REMOVED in AGP 8 and are now a hard error, not a warning. buildConfig, resValues
# and shaders all default to off in AGP 8 anyway, which is what this library
# wants: it is Java plus three .so files, with no resources at all.
