openapi: 3.0.3
info:
  title: TON WalletKit models
  version: 1.0.0
servers:
- url: /
paths: {}
components:
  schemas:
    AccountState:
      additionalProperties: false
      description: |-
        Blockchain state of an account at a given point in time.

        The `status` field distinguishes four cases:
        - `active` — contract deployed, `code` and `data` present
        - `uninitialized` — has balance/history but no contract deployed; `code`/`data` omitted
        - `frozen` — frozen due to storage debt; `frozenHash` points at the pre-freeze state
        - `non-existing` — no on-chain record at all; balance is `'0'` and other fields omitted
      properties:
        address:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
        balance:
          description: Balance formatted in TON (10^9 nanotons = 1 TON).
          type: string
        code:
          description: Base64-encoded contract code BOC. Omitted if the contract is
            not deployed.
          type: string
        data:
          description: Base64-encoded contract data BOC. Omitted if the contract is
            not deployed.
          type: string
        extraCurrencies:
          additionalProperties:
            type: string
          description: Map of extra currency IDs to their amounts. Extra currencies
            are additional tokens that can be attached to TON messages.
          type: object
        lastTransaction:
          $ref: '#/components/schemas/TransactionId'
        rawBalance:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
      required:
      - address
      - balance
      - extraCurrencies
      - rawBalance
      - status
      type: object
    AccountStatus:
      description: |-
        Copyright (c) TonTech.

        This source code is licensed under the MIT license found in the LICENSE file in the root directory of this source tree.
      enum:
      - uninitialized
      - frozen
      - active
      - non-existing
      type: string
    AddressBook:
      additionalProperties:
        $ref: '#/components/schemas/AddressBookEntry'
      description: Map of raw addresses to their metadata entries.
      type: object
    AddressBookEntry:
      additionalProperties: false
      properties:
        address:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
        domain:
          description: The domain name associated with the address if available
          type: string
        interfaces:
          description: List of supported interfaces by the address
          items:
            type: string
          type: array
      required:
      - interfaces
      type: object
    AssetType:
      description: Types of assets supported on the TON blockchain.
      enum:
      - ton
      - jetton
      - nft
      type: string
    BalanceUpdate:
      additionalProperties: false
      properties:
        address:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
        balance:
          description: The formatted balance
          type: string
        rawBalance:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        status:
          $ref: '#/components/schemas/StreamingUpdateStatus'
        type:
          description: The update type field
          enum:
          - balance
          type: string
      required:
      - address
      - balance
      - rawBalance
      - status
      - type
      type: object
    Base64String:
      description: Base64-encoded string representation
      type: string
    BaseProviderUpdate:
      additionalProperties: false
      properties:
        providerId:
          type: string
        type:
          type: string
      required:
      - providerId
      - type
      type: object
    BridgeEvent:
      additionalProperties: false
      description: Base event type for TON Connect bridge communication.
      properties:
        dAppInfo:
          $ref: '#/components/schemas/DAppInfo'
        domain:
          description: Domain of the dApp that initiated the event
          type: string
        from:
          type: string
        id:
          description: Unique identifier for the bridge event
          type: string
        isJsBridge:
          description: Whether the event originated from JS Bridge (injected provider)
          type: boolean
        isLocal:
          type: boolean
        messageId:
          type: string
        returnStrategy:
          description: Raw TonConnect return strategy string.
          type: string
        sessionId:
          description: Session identifier for the connection
          type: string
        tabId:
          description: Browser tab ID for JS Bridge events
          type: string
        traceId:
          type: string
        walletAddress:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
        walletId:
          description: Wallet identifier associated with the event
          type: string
      required:
      - id
      type: object
    CONNECT_EVENT_ERROR_CODES:
      description: |-
        Copyright (c) TonTech.

        This source code is licensed under the MIT license found in the LICENSE file in the root directory of this source tree.
      enum:
      - 0
      - 1
      - 2
      - 3
      - 100
      - 300
      - 400
      type: number
    ConnectionApprovalProof:
      additionalProperties: false
      properties:
        domain:
          $ref: '#/components/schemas/ConnectionApprovalProofDomain'
        payload:
          type: string
        signature:
          description: Base64-encoded string representation
          type: string
        timestamp:
          type: number
      required:
      - domain
      - payload
      - signature
      - timestamp
      type: object
    ConnectionApprovalProofDomain:
      additionalProperties: false
      properties:
        lengthBytes:
          format: int
          type: number
        value:
          type: string
      required:
      - lengthBytes
      - value
      type: object
    ConnectionRequestEventPreview:
      additionalProperties: false
      description: Preview data for displaying connection request in the wallet UI.
      properties:
        dAppInfo:
          $ref: '#/components/schemas/DAppInfo'
        manifestFetchErrorCode:
          description: Error code if manifest fetching failed
          format: int
          type: number
        permissions:
          description: Permissions requested by the dApp
          items:
            $ref: '#/components/schemas/ConnectionRequestEventPreviewPermission'
          type: array
      required:
      - permissions
      type: object
    ConnectionRequestEventPreviewPermission:
      additionalProperties: false
      description: Permission requested by a dApp during connection.
      properties:
        description:
          description: Detailed description of what the permission allows
          type: string
        name:
          description: Identifier name of the permission
          type: string
        title:
          description: Human-readable title of the permission
          type: string
      type: object
    ConnectionRequestEventRequestedItem:
      anyOf:
      - $ref: '#/components/schemas/ConnectionRequestEventRequestedItem_anyOf'
      - $ref: '#/components/schemas/ConnectionRequestEventRequestedItem_anyOf_1'
      - $ref: '#/components/schemas/ConnectionRequestEventRequestedItem_anyOf_2'
      description: "Data to be signed by the wallet, discriminated by type."
    ConnectionRequestTonProofRequestedItem:
      additionalProperties: false
      description: TON Proof request item.
      properties:
        payload:
          type: string
      required:
      - payload
      type: object
    DAppInfo:
      additionalProperties: false
      description: Information about a decentralized application (dApp) connecting
        via TON Connect.
      properties:
        description:
          description: Brief description of the dApp's purpose
          type: string
        iconUrl:
          description: Icon/logo URL of the dApp
          format: url
          type: string
        manifestUrl:
          description: Manifest URL of the dApp
          format: url
          type: string
        name:
          description: Display name of the dApp
          type: string
        url:
          description: Main website URL of the dApp
          format: url
          type: string
      type: object
    DisconnectionEventPreview:
      additionalProperties: false
      description: Preview data for displaying disconnection event in the wallet UI.
      properties:
        dAppInfo:
          $ref: '#/components/schemas/DAppInfo'
        reason:
          description: Human-readable reason for the disconnection
          type: string
      type: object
    EmbeddedConnectionResult:
      description: Opaque type holding the pre-built connection approval response.
        Created by approveConnectRequest when an embedded request is present. Passed
        through to the action approval method which attaches the action result and
        sends it.
      not: {}
    EmbeddedRequest:
      allOf:
      - {}
      - {}
      - {}
      properties:
        method:
          enum:
          - sendTransaction
          - signMessage
          - signData
          type: string
      required:
      - method
      type: object
    EmbeddedSendTransactionRequestEvent:
      additionalProperties: false
      properties:
        dAppInfo:
          $ref: '#/components/schemas/DAppInfo'
        domain:
          description: Domain of the dApp that initiated the event
          type: string
        from:
          type: string
        id:
          description: Unique identifier for the bridge event
          type: string
        isJsBridge:
          description: Whether the event originated from JS Bridge (injected provider)
          type: boolean
        isLocal:
          type: boolean
        messageId:
          type: string
        preview:
          $ref: '#/components/schemas/SendTransactionRequestEventPreview'
        request:
          $ref: '#/components/schemas/TransactionRequest'
        returnStrategy:
          description: Raw TonConnect return strategy string.
          type: string
        sessionId:
          description: Session identifier for the connection
          type: string
        tabId:
          description: Browser tab ID for JS Bridge events
          type: string
        traceId:
          type: string
        type:
          enum:
          - sendTransaction
          type: string
        walletAddress:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
        walletId:
          description: Wallet identifier associated with the event
          type: string
      required:
      - id
      - preview
      - request
      - type
      type: object
    EmbeddedSignDataRequestEvent:
      additionalProperties: false
      properties:
        dAppInfo:
          $ref: '#/components/schemas/DAppInfo'
        domain:
          description: Domain of the dApp that initiated the event
          type: string
        from:
          type: string
        id:
          description: Unique identifier for the bridge event
          type: string
        isJsBridge:
          description: Whether the event originated from JS Bridge (injected provider)
          type: boolean
        isLocal:
          type: boolean
        messageId:
          type: string
        payload:
          $ref: '#/components/schemas/SignDataPayload'
        preview:
          $ref: '#/components/schemas/SignDataRequestEventPreview'
        returnStrategy:
          description: Raw TonConnect return strategy string.
          type: string
        sessionId:
          description: Session identifier for the connection
          type: string
        tabId:
          description: Browser tab ID for JS Bridge events
          type: string
        traceId:
          type: string
        type:
          enum:
          - signData
          type: string
        walletAddress:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
        walletId:
          description: Wallet identifier associated with the event
          type: string
      required:
      - id
      - payload
      - preview
      - type
      type: object
    EmbeddedSignMessageRequestEvent:
      additionalProperties: false
      properties:
        dAppInfo:
          $ref: '#/components/schemas/DAppInfo'
        domain:
          description: Domain of the dApp that initiated the event
          type: string
        from:
          type: string
        id:
          description: Unique identifier for the bridge event
          type: string
        isJsBridge:
          description: Whether the event originated from JS Bridge (injected provider)
          type: boolean
        isLocal:
          type: boolean
        messageId:
          type: string
        preview:
          $ref: '#/components/schemas/SendTransactionRequestEventPreview'
        request:
          $ref: '#/components/schemas/TransactionRequest'
        returnStrategy:
          description: Raw TonConnect return strategy string.
          type: string
        sessionId:
          description: Session identifier for the connection
          type: string
        tabId:
          description: Browser tab ID for JS Bridge events
          type: string
        traceId:
          type: string
        type:
          enum:
          - signMessage
          type: string
        walletAddress:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
        walletId:
          description: Wallet identifier associated with the event
          type: string
      required:
      - id
      - preview
      - request
      - type
      type: object
    EmulationAccountState:
      additionalProperties: false
      description: State of an account at a specific point in an emulated transaction.
      properties:
        accountStatus:
          $ref: '#/components/schemas/AccountStatus'
        balance:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        extraCurrencies:
          additionalProperties:
            type: string
          description: Map of extra currency IDs to their amounts. Extra currencies
            are additional tokens that can be attached to TON messages.
          type: object
      required:
      - accountStatus
      - balance
      type: object
    EmulationAction:
      additionalProperties: false
      description: High-level action extracted from an emulated transaction trace.
      properties:
        accounts:
          description: Addresses of accounts involved in this action
          items:
            $ref: '#/components/schemas/UserFriendlyAddress'
          type: array
        details:
          additionalProperties: {}
          description: Action-specific detail fields keyed by name
          type: object
        endLt:
          description: Logical time value used for ordering transactions on the TON
            blockchain
          type: string
        endUtime:
          description: Unix timestamp when the action ended
          format: timestamp
          type: number
        isSuccess:
          description: Whether the action completed successfully
          type: boolean
        startLt:
          description: Logical time value used for ordering transactions on the TON
            blockchain
          type: string
        startUtime:
          description: Unix timestamp when the action started
          format: timestamp
          type: number
        traceEndLt:
          description: Logical time value used for ordering transactions on the TON
            blockchain
          type: string
        traceEndUtime:
          description: Unix timestamp when the trace ended
          format: timestamp
          type: number
        traceId:
          description: Trace identifier this action belongs to
          type: string
        traceMcSeqnoEnd:
          description: Masterchain block sequence number when the trace ended
          format: int
          type: number
        transactions:
          description: Hex-encoded hashes of transactions involved in this action
          items:
            $ref: '#/components/schemas/Hex'
          type: array
        type:
          description: "Action type identifier (e.g. \"jetton_transfer\", \"ton_transfer\"\
            , \"jetton_swap\")"
          type: string
      required:
      - accounts
      - details
      - endLt
      - endUtime
      - isSuccess
      - startLt
      - startUtime
      - traceEndLt
      - traceEndUtime
      - traceMcSeqnoEnd
      - transactions
      - type
      type: object
    EmulationActionMessageSize:
      additionalProperties: false
      description: Total size of messages created in the action phase.
      properties:
        bits:
          description: Number of bits used
          format: int
          type: number
        cells:
          description: Number of cells used
          format: int
          type: number
      required:
      - bits
      - cells
      type: object
    EmulationActionPhase:
      additionalProperties: false
      description: Action phase of transaction execution (outgoing message sending).
      properties:
        hasNoFunds:
          description: Whether the transaction failed due to insufficient funds
          type: boolean
        isSuccess:
          description: Whether the action phase succeeded
          type: boolean
        isValid:
          description: Whether the action list was valid
          type: boolean
        msgsCreated:
          description: Number of messages created
          format: int
          type: number
        resultCode:
          description: Result code of the action phase
          format: int
          type: number
        skippedActions:
          description: Number of actions skipped
          format: int
          type: number
        specActions:
          description: Number of special actions executed
          format: int
          type: number
        statusChange:
          description: Account status change applied during the action phase
          type: string
        totalActionFees:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        totalActions:
          description: Total number of actions processed
          format: int
          type: number
        totalFwdFees:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        totalMsgSize:
          $ref: '#/components/schemas/EmulationActionMessageSize'
      required:
      - hasNoFunds
      - isSuccess
      - isValid
      - msgsCreated
      - resultCode
      - skippedActions
      - specActions
      - statusChange
      - totalActions
      - totalMsgSize
      type: object
    EmulationAddressBookEntry:
      additionalProperties: false
      description: Address book entry providing human-readable metadata for an on-chain
        address.
      properties:
        domain:
          description: "DNS domain name associated with the address, if any"
          type: string
        interfaces:
          description: List of known interfaces implemented by the contract
          items:
            type: string
          type: array
        userFriendly:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
      required:
      - interfaces
      - userFriendly
      type: object
    EmulationBlockRef:
      additionalProperties: false
      description: Reference to a block in the TON blockchain.
      properties:
        seqno:
          description: Block sequence number
          format: int
          type: number
        shard:
          description: Shard identifier
          type: string
        workchain:
          description: Workchain identifier
          format: int
          type: number
      required:
      - seqno
      - shard
      - workchain
      type: object
    EmulationComputePhase:
      additionalProperties: false
      description: Compute phase of transaction execution (TVM execution).
      properties:
        exitCode:
          description: TVM exit code
          format: int
          type: number
        gasCredit:
          description: "Gas credit, if any"
          type: string
        gasFees:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        gasLimit:
          description: Gas limit for this execution
          type: string
        gasUsed:
          description: Total gas consumed
          type: string
        isAccountActivated:
          description: Whether the account was activated during compute
          type: boolean
        isMsgStateUsed:
          description: Whether the message state was used during compute
          type: boolean
        isSkipped:
          description: Whether the compute phase was skipped
          type: boolean
        isSuccess:
          description: Whether the TVM execution succeeded
          type: boolean
        mode:
          description: Compute execution mode
          format: int
          type: number
        vmSteps:
          description: Number of TVM steps executed
          format: int
          type: number
      required:
      - exitCode
      - gasFees
      - gasLimit
      - gasUsed
      - isAccountActivated
      - isMsgStateUsed
      - isSkipped
      - isSuccess
      - mode
      - vmSteps
      type: object
    EmulationCreditPhase:
      additionalProperties: false
      description: Credit phase of transaction execution.
      properties:
        credit:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
      required:
      - credit
      type: object
    EmulationError:
      additionalProperties: false
      description: Error returned when transaction emulation fails.
      properties:
        code:
          description: Numeric error code
          format: int
          type: number
        message:
          description: Human-readable error message
          type: string
      required:
      - code
      - message
      type: object
    EmulationMessage:
      additionalProperties: false
      description: Message sent or received within an emulated transaction trace.
      properties:
        createdAt:
          description: "Unix timestamp when the message was created, or undefined\
            \ for external inbound messages"
          format: timestamp
          type: number
        createdLt:
          description: Logical time value used for ordering transactions on the TON
            blockchain
          type: string
        destination:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
        fwdFee:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        ihrDisabled:
          description: "Whether IHR delivery is disabled, or undefined for external\
            \ inbound messages"
          type: boolean
        ihrFee:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        importFee:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        initState:
          description: "Initial state (StateInit) attached to the message, if any"
        isBounce:
          description: "Whether the message requested a bounce on failure, or undefined\
            \ for external inbound messages"
          type: boolean
        isBounced:
          description: "Whether the message was bounced back, or undefined for external\
            \ inbound messages"
          type: boolean
        messageContent:
          $ref: '#/components/schemas/EmulationMessageContent'
        source:
          description: "User-friendly TON address representation (e.g., \"EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2\"\
            )"
          type: string
        value:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
        valueExtraCurrencies:
          additionalProperties:
            type: string
          description: Map of extra currency IDs to their amounts. Extra currencies
            are additional tokens that can be attached to TON messages.
          type: object
      required:
      - destination
      - messageContent
      - valueExtraCurrencies
      type: object
    EmulationMessageContent:
      additionalProperties: false
      description: Decoded content of an emulation message body.
      properties:
        body:
          description: Base64-encoded string representation
          type: string
        decoded:
          description: "Structured decoded representation of the message body, if\
            \ available"
      type: object
    EmulationResponse:
      additionalProperties: false
      description: "Unified emulation response model, normalised from either Toncenter\
        \ or TonAPI sources."
      properties:
        actions:
          description: High-level actions extracted from the trace
          items:
            $ref: '#/components/schemas/EmulationAction'
          type: array
        addressBook:
          additionalProperties:
            $ref: '#/components/schemas/EmulationAddressBookEntry'
          description: Address book mapping raw addresses to human-readable metadata
          type: object
        codeCells:
          additionalProperties:
            $ref: '#/components/schemas/Base64String'
          description: Map of code cell hashes to their BOC base64 representations
          type: object
        dataCells:
          additionalProperties:
            $ref: '#/components/schemas/Base64String'
          description: Map of data cell hashes to their BOC base64 representations
          type: object
        isIncomplete:
          description: Whether the trace is incomplete due to limits or errors
          type: boolean
        mcBlockSeqno:
          description: Masterchain block sequence number used during emulation
          format: int
          type: number
        trace:
          $ref: '#/components/schemas/EmulationTraceNode'
        transactions:
          additionalProperties:
            $ref: '#/components/schemas/EmulationTransaction'
          description: Map of transaction hashes to transaction details
          type: object
      required:
      - actions
      - addressBook
      - codeCells
      - dataCells
      - isIncomplete
      - mcBlockSeqno
      - trace
      - transactions
      type: object
    EmulationResultError:
      additionalProperties: false
      description: Failed outcome of a transaction emulation attempt. Contains the
        error code and message describing why emulation could not complete.
      properties:
        emulationError:
          $ref: '#/components/schemas/EmulationError'
        result:
          description: Discriminant tag indicating a failed emulation
          enum:
          - error
          type: string
      required:
      - emulationError
      - result
      type: object
    EmulationResultSuccess:
      additionalProperties: false
      description: Successful outcome of a transaction emulation attempt. Contains
        the full emulation response including trace and actions.
      properties:
        emulationResult:
          $ref: '#/components/schemas/EmulationResponse'
        result:
          description: Discriminant tag indicating a successful emulation
          enum:
          - success
          type: string
      required:
      - emulationResult
      - result
      type: object
    EmulationStoragePhase:
      additionalProperties: false
      description: Storage phase of transaction execution.
      properties:
        statusChange:
          description: Account status change applied during the storage phase
          type: string
        storageFeesCollected:
          description: "Token amount represented as a string to preserve precision.\
            \ For TON, this is typically in nanotons (1 TON = 10^9 nanotons)."
          type: string
      required:
      - statusChange
      - storageFeesCollected
      type: object
    EmulationTraceNode:
      additionalProperties: false
      description: Node in the emulation execution tree.
      properties:
        children:
          description: Child nodes representing spawned messages
          items:
            $ref: '#/components/schemas/EmulationTraceNode'
          type: array
      required:
      - children
