name: CI

# The core is written on Windows, so Linux and macOS are where the backends that
# have never been compiled get their first check: OpenSSL, CommonCrypto, libcurl.
# The sanitizer jobs matter just as much — MSVC only offers ASan, so this is the
# only place the threading is seen by a race detector.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows (bcrypt),     os: windows-latest }
          - { name: linux (openssl+curl), os: ubuntu-latest }
          - { name: macos (commoncrypto), os: macos-latest }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # QuickJS-ng

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      # The native build embeds js/dist/bundle.h, so it must exist first.
      - name: Build the JS bundle
        working-directory: js
        run: npm ci && npm run build

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # Still a node20 action, so GitHub runs it on node24 and warns. Nothing to
      # bump to — upstream has not released a node24 build — and it is what puts
      # cl.exe on PATH for the Ninja generator.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  portable-crypto:
    name: portable crypto backend
    runs-on: ubuntu-latest
    # The fallback every platform without a system backend uses (Android above
    # all), so it is checked even where a better backend exists.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci && npm run build
        working-directory: js
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev
      - run: cmake -B build -S . -G Ninja -DTWK_CRYPTO_BACKEND=portable -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --timeout 300

  sanitizers:
    name: sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address_undefined, thread]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci && npm run build
        working-directory: js
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev

      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" = "thread" ]; then
            flags="-fsanitize=thread -g -O1"
          else
            # -fno-sanitize=function: QuickJS calls its allocator through
            # deliberately cast function pointers, which UBSan's function check
            # rejects. That is third-party code doing it on purpose, and the
            # check is unrelated to anything we could fix.
            flags="-fsanitize=address,undefined -fno-sanitize=function -fno-sanitize-recover=undefined -g -O1"
          fi
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$flags" -DCMAKE_SHARED_LINKER_FLAGS="$flags"

      - run: cmake --build build

      - name: Test
        # Sanitized builds are several times slower, so the timeouts that exist to
        # catch hangs need room; they are hang detectors, not perf assertions.
        env:
          TWK_JS_BUDGET_MS: '600000'
        run: ctest --test-dir build --output-on-failure --timeout 900

  binding-android:
    name: Android AAR
    runs-on: ubuntu-latest
    # Produces the artifact the binding is actually shared as. Telegram Android
    # is the consumer this exists for, so the settings match theirs: minSdk 21,
    # c++_static, NDK r27.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci && npm run build
        working-directory: js
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev

      - name: Install NDK r27
        # Pinned to Telegram Android's ndkVersion rather than whatever the image
        # ships: c++_static means the STL is not shared, but keeping the compiler
        # the same removes one variable from any crash report they send back.
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build a host twk-bundlec
        # The bytecode step needs a tool that runs on the build machine; without
        # it the bundle is embedded as source and startup costs ~280ms more.
        run: |
          cmake -B build-host -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --target twk-bundlec

      - name: Check the generated DTOs are in sync with the walletkit types
        # A hand-edit would be silently overwritten on the next regeneration.
        # Only the steps the Java models need: `npm run build` would also run the
        # C# generator, which downloads a 30 MB jar to produce output this job
        # does not look at.
        run: |
          npm ci --prefix scripts/generate-api
          npm run surface --prefix scripts/generate-api
          npm run schema --prefix scripts/generate-api
          npm run openapi --prefix scripts/generate-api
          npm run java --prefix scripts/generate-api
          git diff --exit-code bindings/android/src/main/java/org/ton/walletkit/api

      - name: Verify the JNI layer and the DTOs on a desktop JVM
        # No emulator, but this runs the actual core through the actual JNI shim
        # and derives the golden address. Only src/main/java compiles here —
        # src/android/java needs a Context.
        #
        # org.json is the one jar downloaded: it ships in android.jar on device,
        # so it is a test-only dependency and never reaches the AAR.
        run: |
          cmake --build build-host --target twk_jni
          mkdir -p build-jni
          curl -sSLo build-jni/json.jar \
            https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          javac -nowarn -cp build-jni/json.jar -d build-jni \
                $(find bindings/android/src/main/java -name '*.java') \
                bindings/android/test/JniSmoke.java bindings/android/test/DtoSmoke.java
          java -cp "build-jni:build-jni/json.jar" DtoSmoke
          java -Djava.library.path=build-host/bin -cp "build-jni:build-jni/json.jar" JniSmoke

      - name: No dependency crept into the binding
        # The whole point of the org.json DTOs: an app adds the .aar and nothing
        # else. An import of a JSON library would quietly undo that.
        run: |
          ! grep -rn "com\.google\.gson\|com\.fasterxml" bindings/android/src bindings/android/build.gradle

      - name: Cross-build libtwk_jni.so
        run: |
          export TWK_BUNDLEC="$PWD/build-host/bin/twk-bundlec"
          scripts/android-build.sh

      # Pinned rather than using whatever Gradle the image ships: AGP 8.5 wants
      # Gradle 8.x, and an image that moves to Gradle 9 would break this job with
      # no change of ours.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble the AAR
        run: gradle --no-daemon assembleRelease
        working-directory: bindings/android

      - name: Check what shipped
        # An AAR that quietly lost an ABI still builds and still installs; it
        # fails at System.loadLibrary on whichever device nobody tested.
        run: |
          aar=bindings/android/build/outputs/aar/ton-walletkit-release.aar
          unzip -l "$aar"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$aar" | grep -q "jni/$abi/libtwk_jni.so" || { echo "missing $abi"; exit 1; }
          done
          unzip -l "$aar" | grep -q 'classes.jar' || { echo 'no classes.jar'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ton-walletkit-aar
          path: bindings/android/build/outputs/aar/*.aar
          if-no-files-found: error

  binding-csharp:
    name: C# binding
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci && npm run build
        working-directory: js
      # Still a node20 action, so GitHub runs it on node24 and warns. Nothing to
      # bump to — upstream has not released a node24 build — and it is what puts
      # cl.exe on PATH for the Ninja generator.
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the core
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build

      - name: Check the generated facade is in sync with api/facade.json
        # A hand-edit to the generated facade would be silently overwritten on the
        # next regeneration, so it must not exist.
        run: |
          node scripts/generate-facade.mjs csharp
          git diff --exit-code bindings/csharp/src/Facade

      - name: Build the binding
        run: dotnet build bindings/csharp/Ton.WalletKit.csproj -c Release

      - name: Interop smoke against the real library
        # Published to a fixed directory: the build output path depends on the
        # platform the SDK picks (bin/x64/Release here), which is not worth guessing.
        run: |
          dotnet publish bindings/csharp/test/InteropSmoke/InteropSmoke.csproj -c Release -o smoke
          copy build\bin\twk.dll smoke\
          dotnet smoke\InteropSmoke.dll
